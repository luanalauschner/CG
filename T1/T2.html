<!DOCTYPE html>
<html>

<head>
   <title>T2 - Castelo de Bodiam (FPAA)</title>

   <link rel="shortcut icon" href="../favicon.ico">
   <link rel="stylesheet" href="../html/resources/default.css">
   <link rel="stylesheet" href="../html/resources/menuFirstPerson.css">
   <link rel="stylesheet" href="T2.css">
   <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
   <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
   <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
   <script type="importmap">
      {"imports": {"three": "../build/three.module.js"}}
   </script>

   <!-- MIRA (crosshair): fixa no centro da tela. Controlada por cameraShooting.js. -->
   <div id="crosshair">
      <span class="ch-h"></span>
      <span class="ch-v"></span>
      <span class="ch-dot"></span>
   </div>

   <!-- Barra de recarga da besta (aparece logo abaixo da mira após cada disparo) -->
   <div id="recarga"><div class="valor"></div></div>

   <!-- HUD das chaves (preenchido por keys.js) -->
   <div id="hud-chaves">
      <div class="slots"></div>
      <div class="texto"></div>
   </div>

   <div id="webgl-output">
      <script type="module" src="main.js"></script>
   </div>
</body>

</html>
