<!DOCTYPE html>
<html>

<head>
   <title>T1 - Castelo de Bodiam (FPAA)</title>

   <link rel="shortcut icon" href="../favicon.ico">
   <link rel="stylesheet" href="../html/resources/default.css">
   <link rel="stylesheet" href="../html/resources/menuFirstPerson.css">
   <link rel="stylesheet" href="T1.css">
   <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
   <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
   <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
   <script type="importmap">
      {"imports": {"three": "../build/three.module.js"}}
   </script>

   <!-- MIRA (crosshair): fixa no centro da tela, indica para onde o jogador olha
        e a direção dos disparos. É controlada por cameraShooting.js. -->
   <div id="crosshair">
      <span class="ch-h"></span>
      <span class="ch-v"></span>
      <span class="ch-dot"></span>
   </div>

   <!-- Painel exibido enquanto o mouse não está capturado -->
   <div id="blocker" class="w3-display-container">
      <div id="instructions" class="w3-display-middle w3-center w3-white w3-opacity">
         <h1>Castelo de Bodiam</h1>
         <p>Movimentação: W A S D / setas</p>
         <p>Olhar: mouse</p>
         <p>Disparo: bot&otilde;es do mouse</p>
         <p>C&acirc;mera orbital: tecla C</p>
         <p>(clique para come&ccedil;ar)</p>
      </div>
   </div>

   <div id="webgl-output">
      <script type="module" src="main.js"></script>
   </div>
</body>

</html>
